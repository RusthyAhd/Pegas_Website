<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Register for the FlutterHub Membership Card and get access to premium updates, perks, and launch access.">
    <meta name="robots" content="noindex, follow">
    <title>FlutterHub Membership Registration | Pegas</title>

    <link rel="icon" type="image/png" href="assets/images/favicon updated.png">
    <link rel="stylesheet" href="css/styles.css?v=11.1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="register-page">
    <header class="register-header">
        <div class="register-nav">
            <a class="register-brand" href="index.html" aria-label="Return to home">
                <img src="assets/images/Pegas_Logo.png" alt="Pegas Logo">
                <div>
                    <h2 class="logo-text">Pegas<span class="logo-superscript">LK</span></h2>
                </div>
            </a>
        </div>
    </header>

    <main class="register-page-shell">
        <section class="register-card register-card--solo" aria-label="FlutterHub registration form">
            <div class="register-card-inner">
                <div class="register-card-copy">
                    <div class="register-badge"><i class="fas fa-crown"></i> FlutterHub Membership</div>
                    <h1 class="register-card-title">Register Here</h1>
                    <p class="register-card-subtitle">Complete the form below and our team will reach out with the next steps.</p>
                </div>

                <form class="register-form">
                    <div>
                        <label for="fullName">Full Name <span style="color:#f43f5e;">*</span></label>
                        <input id="fullName" name="fullName" type="text" placeholder="Your full name" required>
                    </div>

                    <div>
                        <label for="phone">Phone Number <span style="color:#f43f5e;">*</span></label>
                        <input id="phone" name="phone" type="tel" placeholder="+94 ..." required>
                    </div>

                    <div>
                        <label for="address">Address</label>
                        <textarea id="address" name="address" placeholder="Your address"></textarea>
                    </div>

                    <div>
                        <label for="email">Email <span class="optional-label">(Optional)</span></label>
                        <input id="email" name="email" type="email" placeholder="you@example.com">
                    </div>

                    <!-- Mandatory Security Passcode Section -->
                    <div class="form-row">
                        <div>
                            <label for="passcode">Create Passcode <span style="color:#f43f5e;">*</span></label>
                            <input id="passcode" name="passcode" type="password" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" placeholder="Enter 4-digit passcode" required>
                        </div>

                        <div>
                            <label for="confirmPasscode">Confirm Passcode <span style="color:#f43f5e;">*</span></label>
                            <input id="confirmPasscode" name="confirmPasscode" type="password" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" placeholder="Confirm 4-digit passcode" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="register-submit" type="submit">
                            <i class="fas fa-paper-plane"></i>
                            Register Here
                        </button>
                    </div>

                    <p class="register-note">For Enquiries : +94-72 956 8752</p>
                </form>
            </div>
        </section>
    </main>

    <!-- Passcode Validation Script -->
    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('.register-form');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitBtn = form.querySelector('.register-submit');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

                const fullName = document.getElementById('fullName').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const address = document.getElementById('address').value.trim();
                const email = document.getElementById('email').value.trim();
                const passcode = document.getElementById('passcode').value.trim();
                const confirmPasscode = document.getElementById('confirmPasscode').value.trim();

                if (!passcode || passcode.length !== 4 || isNaN(passcode)) {
                    alert('⚠️ Please enter a valid 4-digit numeric passcode.');
                    resetBtn();
                    return;
                }

                if (passcode !== confirmPasscode) {
                    alert('⚠️ Passcodes do not match! Please verify your passcode.');
                    resetBtn();
                    return;
                }

                try {
                    // Check if passcode is unique
                    const usersRef = collection(db, "users");
                    const q = query(usersRef, where("passcode", "==", passcode));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        alert('⚠️ This passcode is already in use. Please choose another one.');
                        resetBtn();
                        return;
                    }

                    // Save user to Firestore
                    await addDoc(usersRef, {
                        fullName,
                        phone,
                        address,
                        email,
                        passcode,
                        balance: 0,
                        createdAt: new Date().toISOString()
                    });

                    // Save registered passcode locally for dashboard PIN verification just to cache (optional but keeping original behavior of login fallback, actually no, let's just log them in later)
                    localStorage.setItem('user_registered_pin', passcode);

                    alert('🎉 Registration Successful!\nYour 4-digit security passcode has been created.');
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error("Error adding document: ", error);
                    alert("Error during registration. Please try again.");
                    resetBtn();
                }

                function resetBtn() {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Register Here';
                }
            });
        });
    </script>
</body>
</html>
